name: Release image

# Publishes the release image from the locally built emulator archive attached to
# a GitHub release. The archive must match the hash committed in releases/<tag>.json.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)publish, e.g. v37.3.10-r1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  image:
    name: Verify, build, sign and attest
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write      # upload the SBOM to the release
      packages: write      # push to GHCR
      id-token: write      # keyless cosign signing and attestations
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Read committed release record
        run: |
          python3 -I - "$TAG" >> "$GITHUB_ENV" <<'PY'
          import json, re, sys
          tag = sys.argv[1]
          if not re.fullmatch(r'v\d+\.\d+\.\d+-r[1-9]\d*', tag):
              sys.exit(f'Invalid release tag: {tag}')
          record = json.load(open(f'releases/{tag}.json'))
          assert record['tag'] == tag and record['image_tag'] == tag[1:], 'Record does not match tag'
          assert re.fullmatch(r'[0-9a-f]{64}', record['archive']['sha256'])
          assert re.fullmatch(r'[a-z0-9./-]+', record['image']), 'Image name must be lowercase'
          print(f"IMAGE={record['image']}")
          print(f"IMAGE_TAG={record['image_tag']}")
          print(f"ARCHIVE={record['archive']['name']}")
          print(f"ARCHIVE_SHA256={record['archive']['sha256']}")
          PY

      - name: Download and verify the emulator archive
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARCHIVE" --dir "$RUNNER_TEMP/release"
          echo "$ARCHIVE_SHA256  $RUNNER_TEMP/release/$ARCHIVE" | sha256sum --check --strict
          mkdir build-inputs
          tar -xzf "$RUNNER_TEMP/release/$ARCHIVE" -C build-inputs --no-same-owner --no-same-permissions

      - name: Source and input-validation tests
        run: python3 -m unittest discover -s tests -v

      - name: Install Podman
        run: |
          command -v podman >/dev/null || { sudo apt-get update && sudo apt-get install -y podman; }
          podman version

      - name: Build release image
        run: |
          podman build --platform linux/arm64 --pull=always \
            --label "org.opencontainers.image.version=$IMAGE_TAG" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:$IMAGE_TAG" -f Containerfile .

      - name: Smoke test
        run: scripts/verify-container smoke "$IMAGE:$IMAGE_TAG"

      - name: Push to GHCR
        run: |
          mkdir -p ~/.docker
          # Write credentials where cosign, syft and the attestation actions find them.
          echo "$GH_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin --authfile ~/.docker/config.json
          podman push --authfile ~/.docker/config.json --digestfile "$RUNNER_TEMP/digest" "$IMAGE:$IMAGE_TAG"
          echo "DIGEST=$(cat "$RUNNER_TEMP/digest")" >> "$GITHUB_ENV"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image (keyless)
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ env.DIGEST }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # actions/attest generates SLSA provenance by default, or an SBOM attestation with sbom-path.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true

      - name: Attach SBOM and digest to the release
        run: |
          cp "$RUNNER_TEMP/sbom.spdx.json" "$RUNNER_TEMP/image-$TAG.spdx.json"
          echo "$IMAGE@$DIGEST" > "$RUNNER_TEMP/image-$TAG.digest"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$RUNNER_TEMP/image-$TAG.spdx.json" "$RUNNER_TEMP/image-$TAG.digest"
          echo "Published $IMAGE:$IMAGE_TAG as $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
